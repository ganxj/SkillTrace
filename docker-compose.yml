services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_learning_os_postgres
    environment:
      POSTGRES_DB: ai_learning_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_learning_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

