services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: ai_learning_os_api
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@192.168.1.49:5432/ai_learning_os}
      SEED_DOMAIN_PACKS: "true"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CORS_ORIGINS: '["*"]'
    ports:
      - "8898:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: apps/admin_next/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        API_INTERNAL_BASE_URL: http://api:8000/api/v1
    container_name: ai_learning_os_admin
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      API_INTERNAL_BASE_URL: http://api:8000/api/v1
    ports:
      - "3100:3000"
